<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041214"/>
      <stop offset="50%" stop-color="#0a262a"/>
      <stop offset="100%" stop-color="#020a0b"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow-ampel" cx="300" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#041214" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  
  
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="300" cy="170" r="260" fill="url(#glow-ampel)"/>
    
    <!-- Medical Prescription Traffic Light (Ampel) -->
    <g transform="translate(180, 60)">
      <!-- Ampel Box -->
      <rect x="40" y="10" width="80" height="190" rx="20" fill="#042f2e" stroke="#2dd4bf" stroke-width="2.5"/>
      
      <!-- Red Light -->
      <circle cx="80" cy="45" r="20" fill="#ef4444" opacity="0.3" stroke="#f87171" stroke-width="1.5"/>
      <circle cx="80" cy="45" r="10" fill="#ef4444" opacity="0.4"/>
      
      <!-- Yellow Light -->
      <circle cx="80" cy="105" r="20" fill="#eab308" opacity="0.3" stroke="#fde047" stroke-width="1.5"/>
      <circle cx="80" cy="105" r="10" fill="#eab308" opacity="0.4"/>
      
      <!-- Green Light (Active Glow) -->
      <circle cx="80" cy="165" r="24" fill="#22c55e" opacity="0.3"/>
      <circle cx="80" cy="165" r="20" fill="#22c55e" stroke="#86efac" stroke-width="2"/>
      <circle cx="80" cy="165" r="10" fill="#ffffff"/>
      
      <!-- Caduceus / Prescription Cross Line -->
      <path d="M140 70 L190 70 M165 45 L165 95" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="165" cy="140" r="14" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
      <path d="M160 140 L164 144 L171 137" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <g transform="translate(0, 58)">
        <rect width="190" height="26" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
        <text x="95" y="17" text-anchor="middle" class="badge-text" fill="#a7f3d0">MEDICAL COMPLIANCE</text>
      </g>
      
      <text x="0" y="142" class="title" font-size="54" fill="url(#title-grad)">VerordnungsAmpel</text>
      
      <text x="0" y="184" class="subtitle" font-size="20" fill="#ccfbf1">Medical Prescription &amp; Budget Traffic-Light System</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#94a3b8" opacity="0.8">Real-time prescription validation, Heilmittelkatalog budget guidance, and local safety.</text>
      
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="145" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">🚦 Traffic Light</text>
        </g>
        <g transform="translate(157, 0)">
          <rect width="145" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">💊 Budget Guidance</text>
        </g>
        <g transform="translate(314, 0)">
          <rect width="145" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="72" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">🔒 Local Privacy</text>
        </g>
      </g>
    </g>
    
</svg>